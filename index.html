<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ПЕРЕУЛОК</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  background: #000; color: #eee;
  font-family: 'Segoe UI Light', 'Helvetica Neue', Arial, sans-serif;
  font-weight: 300;
  overflow: hidden;
}

#game { position: fixed; inset: 0; }

/* ==== СЦЕНА ==== */
.vn-scene { position: absolute; inset: 0; overflow: hidden; }

.bg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  transition: opacity 1.2s ease, background 1.2s ease;
}

.rain {
  position: absolute; inset: 0; pointer-events: none; z-index: 2; opacity: .14;
  background-image: repeating-linear-gradient(100deg, transparent 0 6px, rgba(200,210,230,.35) 6px 7px);
  animation: rainFall .5s linear infinite;
}
@keyframes rainFall { from{background-position:0 0} to{background-position:40px 80px} }

.vignette {
  position: absolute; inset: 0; pointer-events: none; z-index: 3;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.9) 100%);
}

/* ==== ПЕРСОНАЖ ==== */
.vn-char {
  position: absolute; bottom: 180px; left: 50%;
  transform: translateX(-50%) translateY(40px);
  height: 62vh; width: auto;
  opacity: 0; transition: opacity .8s ease, transform .8s ease;
  z-index: 4; pointer-events: none;
  filter: drop-shadow(0 0 25px rgba(201,176,55,.35));
}
.vn-char.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ==== ДИАЛОГ ==== */
.vn-box {
  position: absolute; bottom: 0; left: 0; right: 0;
  min-height: 180px;
  background: linear-gradient(to top, rgba(3,3,6,.98), rgba(8,8,14,.92));
  border-top: 2px solid #c9b037;
  padding: 22px 40px 30px;
  z-index: 10;
  box-shadow: 0 -10px 40px rgba(0,0,0,.9);
}
.vn-speaker {
  color: #c9b037; font-size: 1.05em; letter-spacing: 3px;
  text-transform: uppercase; margin-bottom: 10px;
  min-height: 1.2em;
  text-shadow: 0 0 15px rgba(201,176,55,.5);
}
.vn-line {
  font-size: 1.15em; line-height: 1.7; color: #ddd;
  min-height: 3.4em; max-width: 900px;
}
.vn-line.narration { font-style: italic; color: #aaa; }
.vn-hint {
  position: absolute; bottom: 14px; right: 40px;
  color: #c9b037; font-size: 1.4em;
  animation: bounce 1.2s infinite; opacity: .8;
}
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(6px)} }

/* ==== ВЫБОР ==== */
.vn-choices {
  position: absolute; bottom: 200px; left: 50%;
  transform: translateX(-50%);
  width: 90%; max-width: 640px;
  z-index: 15;
  display: flex; flex-direction: column; gap: 12px;
}
.vn-choice {
  display: block;
  background: rgba(8,8,14,.92);
  border: 1px solid #444;
  color: #ccc;
  padding: 16px 24px;
  font-family: inherit; font-weight: 300;
  font-size: 1.05em;
  cursor: pointer;
  transition: all .3s ease;
  letter-spacing: 1px;
  text-align: left;
}
.vn-choice:hover {
  border-color: #c9b037; color: #c9b037;
  background: rgba(201,176,55,.1);
  box-shadow: 0 0 25px rgba(201,176,55,.25);
  transform: translateX(6px);
}

/* ==== МЕНЮ ==== */
.nv-menu {
  position: absolute; inset: 0;
  display: flex; align-items: center;
  padding-left: clamp(2rem, 10vw, 9rem);
  z-index: 5;
}
.nv-menu-inner { text-align: left; }
.nv-logo {
  font-size: clamp(2.5rem, 6vw, 4rem);
  letter-spacing: .18em;
  color: #c9b037;
  text-shadow: 0 0 40px rgba(201,176,55,.5);
  font-weight: 200;
  margin-bottom: 1.5rem;
}
.nv-actions {
  display: flex; flex-direction: column;
  align-items: flex-start; gap: .6rem;
  font-size: clamp(1.12rem, 1.8vw, 1.45rem);
  letter-spacing: .13em;
}
.nv-btn {
  background: transparent; border: none;
  border-left: 1px solid transparent;
  color: #ddd; cursor: pointer;
  font-family: inherit; font-weight: 200;
  font-size: inherit; letter-spacing: inherit;
  padding: .3rem .5rem; margin-left: -.5rem;
  transition: all .25s ease;
  text-align: left;
}
.nv-btn:hover {
  color: #fff;
  transform: translateX(.35rem);
  border-left-color: rgba(201,176,55,.8);
  background: linear-gradient(90deg,rgba(201,176,55,.15),transparent 88%);
  text-shadow: 0 0 8px rgba(255,255,255,.75);
}
.nv-shade {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, rgba(0,0,0,.7), rgba(0,0,0,.15) 64%, rgba(0,0,0,.3));
}

/* ==== НАСТРОЙКИ ==== */
.nv-settings {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  z-index: 5; padding: 2rem;
}
.nv-settings-inner {
  width: min(30rem, 88vw);
  padding: 2rem;
  background: linear-gradient(135deg,rgba(1,3,5,.96),rgba(8,12,15,.91));
  border: 1px solid rgba(202,220,225,.35);
  border-left: 2px solid rgba(235,247,249,.75);
}
.nv-settings h2 {
  color: #c9b037; letter-spacing: .24em; font-weight: 200;
  font-size: 1.4rem; margin-bottom: 1.5rem;
}
.nv-setting { margin: 1rem 0; }
.nv-setting label {
  display: flex; justify-content: space-between;
  font-size: 1rem; letter-spacing: .12em;
  margin-bottom: .6rem;
}
.nv-setting input[type=range] {
  width: 100%; accent-color: #c9b037;
}

/* ==== ЗАГОЛОВОК ГЛАВЫ ==== */
.chapter-title {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  text-align: center; z-index: 20;
  pointer-events: none;
  animation: appear 1.5s ease forwards;
}
@keyframes appear { from{opacity:0} to{opacity:1} }
.chapter-title h1 {
  color: #c9b037; font-size: 2.4em; letter-spacing: 6px;
  text-transform: uppercase; font-weight: 200;
  text-shadow: 0 0 40px rgba(201,176,55,.6);
  margin-bottom: 12px;
}
.chapter-title p {
  color: #888; letter-spacing: 8px;
  font-size: .9em; text-transform: uppercase;
}

/* ==== ЗВУК ==== */
.sound-toggle {
  position: fixed; top: 20px; right: 20px; z-index: 200;
  background: rgba(8,8,14,.9);
  border: 1px solid #333; color: #888;
  width: 50px; height: 50px; border-radius: 50%;
  cursor: pointer; font-size: 1.3em;
  transition: all .3s ease;
  display: flex; align-items: center; justify-content: center;
}
.sound-toggle:hover {
  border-color: #c9b037; color: #c9b037;
  box-shadow: 0 0 20px rgba(201,176,55,.4);
}
.sound-toggle.on { border-color: #c9b037; color: #c9b037; }

/* ==== АДАПТИВ ==== */
@media (max-width: 700px) {
  .vn-box { padding: 16px 20px 50px; min-height: 150px; }
  .vn-line { font-size: 1em; }
  .vn-char { height: 50vh; bottom: 150px; }
  .chapter-title h1 { font-size: 1.5em; letter-spacing: 3px; }
  .vn-choices { bottom: 170px; }
}
</style>
</head>

// ============================================================================
// ЗВУКОВОЙ ДВИЖОК (Web Audio API)
// ============================================================================
var audioCtx = null;
var soundOn = false;
var sfxVolume = 0.7;
var rainNode = null, rainGain = null, jazzTimer = null;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function startAmbient() {
  if (!audioCtx || rainNode) return;
  var size = 2 * audioCtx.sampleRate;
  var buf = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
  var data = buf.getChannelData(0);
  for (var i = 0; i < size; i++) data[i] = Math.random() * 2 - 1;
  rainNode = audioCtx.createBufferSource();
  rainNode.buffer = buf; rainNode.loop = true;
  var f = audioCtx.createBiquadFilter();
  f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 0.6;
  rainGain = audioCtx.createGain(); rainGain.gain.value = 0.035 * sfxVolume;
  rainNode.connect(f); f.connect(rainGain); rainGain.connect(audioCtx.destination);
  rainNode.start();
  scheduleJazz();
}

function stopAmbient() {
  if (rainNode) { try { rainNode.stop(); } catch(e){} rainNode = null; }
  if (jazzTimer) { clearTimeout(jazzTimer); jazzTimer = null; }
}

var jazzNotes = [220, 247, 262, 294, 330, 349, 392, 440];
function scheduleJazz() {
  if (!soundOn || !audioCtx) return;
  jazzTimer = setTimeout(function() {
    if (!soundOn) return;
    var now = audioCtx.currentTime;
    var o = audioCtx.createOscillator(), g = audioCtx.createGain(), f = audioCtx.createBiquadFilter();
    o.type = 'sawtooth';
    o.frequency.value = jazzNotes[Math.floor(Math.random()*jazzNotes.length)];
    f.type = 'lowpass'; f.frequency.value = 1100; f.Q.value = 2;
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(0.022 * sfxVolume, now + 0.3);
    g.gain.exponentialRampToValueAtTime(0.001, now + 1.6);
    o.connect(f); f.connect(g); g.connect(audioCtx.destination);
    o.start(now); o.stop(now + 1.7);
    scheduleJazz();
  }, 3500 + Math.random() * 5000);
}

function playGunshot() {
  if (!audioCtx || !soundOn) return;
  var now = audioCtx.currentTime;
  var size = audioCtx.sampleRate * 0.3;
  var buf = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
  var d = buf.getChannelData(0);
  for (var i = 0; i < size; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/size, 3);
  var n = audioCtx.createBufferSource(); n.buffer = buf;
  var f = audioCtx.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(3000, now); f.frequency.exponentialRampToValueAtTime(100, now+0.3);
  var g = audioCtx.createGain(); g.gain.setValueAtTime(0.5 * sfxVolume, now);
  g.gain.exponentialRampToValueAtTime(0.001, now+0.3);
  n.connect(f); f.connect(g); g.connect(audioCtx.destination); n.start(now);
  var o = audioCtx.createOscillator(), og = audioCtx.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(120, now);
  o.frequency.exponentialRampToValueAtTime(40, now+0.2);
  og.gain.setValueAtTime(0.4 * sfxVolume, now);
  og.gain.exponentialRampToValueAtTime(0.001, now+0.25);
  o.connect(og); og.connect(audioCtx.destination); o.start(now); o.stop(now+0.3);
}

function playThunder() {
  if (!audioCtx || !soundOn) return;
  var now = audioCtx.currentTime;
  var size = audioCtx.sampleRate * 2;
  var buf = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
  var d = buf.getChannelData(0);
  for (var i = 0; i < size; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/size, 1.5);
  var n = audioCtx.createBufferSource(); n.buffer = buf;
  var f = audioCtx.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(200, now); f.frequency.exponentialRampToValueAtTime(60, now+1.5);
  var g = audioCtx.createGain(); g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.14 * sfxVolume, now+0.1);
  g.gain.exponentialRampToValueAtTime(0.001, now+2);
  n.connect(f); f.connect(g); g.connect(audioCtx.destination); n.start(now);
}

function playFootsteps(count) {
  if (!audioCtx || !soundOn) return;
  count = count || 4;
  for (var i = 0; i < count; i++) {
    (function(i){
      var t = audioCtx.currentTime + i * 0.35;
      var o = audioCtx.createOscillator(), g = audioCtx.createGain(), f = audioCtx.createBiquadFilter();
      o.type = 'sine'; o.frequency.setValueAtTime(80, t);
      o.frequency.exponentialRampToValueAtTime(40, t+0.1);
      f.type = 'lowpass'; f.frequency.value = 200;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.08 * sfxVolume, t+0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t+0.15);
      o.connect(f); f.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+0.2);
    })(i);
  }
}

function playDoor() {
  if (!audioCtx || !soundOn) return;
  var now = audioCtx.currentTime;
  var o = audioCtx.createOscillator(), g = audioCtx.createGain(), f = audioCtx.createBiquadFilter();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(200, now);
  o.frequency.linearRampToValueAtTime(350, now+0.4);
  o.frequency.linearRampToValueAtTime(250, now+0.8);
  g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(0.03 * sfxVolume, now+0.1);
  g.gain.exponentialRampToValueAtTime(0.001, now+0.9);
  f.type = 'bandpass'; f.frequency.value = 600; f.Q.value = 5;
  o.connect(f); f.connect(g); g.connect(audioCtx.destination); o.start(now); o.stop(now+1);
}

function playDawn() {
  if (!audioCtx || !soundOn) return;
  var notes = [262, 330, 392, 523];
  notes.forEach(function(freq, i) {
    var now = audioCtx.currentTime + i*0.15;
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(0.04 * sfxVolume, now+0.1);
    g.gain.exponentialRampToValueAtTime(0.001, now+1.5);
    o.connect(g); g.connect(audioCtx.destination); o.start(now); o.stop(now+1.6);
  });
}

function playDark() {
  if (!audioCtx || !soundOn) return;
  var now = audioCtx.currentTime;
  var o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(60, now);
  o.frequency.exponentialRampToValueAtTime(30, now+1.5);
  g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(0.1 * sfxVolume, now+0.3);
  g.gain.exponentialRampToValueAtTime(0.001, now+2);
  o.connect(g); g.connect(audioCtx.destination); o.start(now); o.stop(now+2);
}

// ============================================================================
// ПЕРЕХОДЫ И ЗВУКОВЫЕ ТРИГГЕРЫ
// ============================================================================
function triggerSounds(name) {
  if (!soundOn) return;
  if (name === 'Пролог' || name === 'Переулок-1' || name === 'Переулок-2') startAmbient();
  if (name === 'Переулок-3') playFootsteps(4);
  if (name === 'Переулок-4') { playGunshot(); setTimeout(playThunder, 100); }
  if (name === 'Переулок-повтор') { playFootsteps(4); setTimeout(playGunshot, 1500); }
  if (name === 'Улица-Гринвуд' || name === 'Эллис-правда') playDoor();
  if (name === 'Бар' || name === 'Бармен-разговор') startAmbient();
  if (name === 'Свобода' || name === 'Эпилог') { playDawn(); stopAmbient(); }
  if (name === 'Вечный-детектив' || name === 'Безумие') { playDark(); }
  if (name === 'Menu') stopAmbient();
}

function showPassage(name) {
  var container = document.getElementById('game');
  if (!passages[name]) {
    container.innerHTML = '<div style="padding:50px;color:#fff;">Пассаж не найден: ' + name + '</div>';
    return;
  }
  container.innerHTML = passages[name];

  // Навешиваем обработчики на все кнопки с data-goto
  container.querySelectorAll('[data-goto]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      if (!audioCtx) initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      showPassage(this.getAttribute('data-goto'));
    });
  });

  // Заголовок главы — исчезает через 3 сек
  var titleDiv = container.querySelector('.chapter-title');
  if (titleDiv) {
    setTimeout(function(){
      titleDiv.style.transition = 'opacity 1s ease';
      titleDiv.style.opacity = '0';
    }, 2500);
  }

  // Настройки — обработчик ползунка
  var sfxRange = container.querySelector('#sfxRange');
  var sfxLabel = container.querySelector('#sfxLabel');
  if (sfxRange) {
    sfxRange.value = sfxVolume;
    sfxLabel.textContent = Math.round(sfxVolume * 100) + '%';
    sfxRange.addEventListener('input', function() {
      sfxVolume = parseFloat(this.value);
      sfxLabel.textContent = Math.round(sfxVolume * 100) + '%';
      if (rainGain) rainGain.gain.value = 0.035 * sfxVolume;
    });
  }

  triggerSounds(name);
}

// ============================================================================
// КНОПКА ЗВУКА
// ============================================================================
document.getElementById('soundToggle').addEventListener('click', function(e) {
  e.stopPropagation();
  initAudio();
  soundOn = !soundOn;
  if (soundOn) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    this.innerHTML = '🔊';
    this.classList.add('on');
    startAmbient();
  } else {
    this.innerHTML = '🔇';
    this.classList.remove('on');
    stopAmbient();
  }
});

// Активируем аудио при первом клике
document.addEventListener('click', function() {
  if (!audioCtx) initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}, { once: false });

// ============================================================================
// СТАРТ
// ============================================================================
showPassage('Menu');
</script>
